<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iter 4.12 | ¡Por Dios y Para Dios!</title>
    <meta
      name="description"
      content="Iter 4.12 es una comunidad católica de jóvenes en Bogotá que realiza retiros espirituales semestrales para fortalecer la fe, la fraternidad y el encuentro con Cristo."
    />
    <meta
      name="keywords"
      content="retiro católico Bogotá, comunidad católica jóvenes, retiro espiritual jóvenes, Iter 4.12, iglesia jóvenes Bogotá, retiro juvenil católico"
    />
    <meta name="author" content="Comunidad Católica Iter 4.12" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="Spanish" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/logo-iter.png" />
    <link rel="apple-touch-icon" href="/logo-iter.png" />

    <!-- Open Graph (Facebook / WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Iter 4.12 | Comunidad Católica de Jóvenes"
    />
    <meta
      property="og:description"
      content="Únete a nuestros retiros católicos semestrales en Bogotá. Un espacio para jóvenes que buscan crecer en la fe y vivir una experiencia transformadora."
    />
    <meta property="og:image" content="https://iter412.com/logo-iter.png" />
    <meta property="og:url" content="https://iter412.com" />
    <meta property="og:site_name" content="Iter 4.12" />
    <meta property="og:locale" content="es_CO" />

    <!-- Instagram -->
    <meta
      property="og:see_also"
      content="https://www.instagram.com/iter4.12bogota/"
    />

    <!-- Canonical -->
    <link rel="canonical" href="https://iter412.com" />
    <style>
      /* Pantalla de carga inicial: se muestra antes de que cargue el JS. Mismo logo y misma
         animación que <Spinner> (frontend/src/components/Spinner), duplicada aquí a propósito
         porque este bloque se pinta antes de que exista el bundle de React. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fafafa;
        transition: opacity 0.4s ease;
      }
      #splash.splash-hide {
        opacity: 0;
        pointer-events: none;
      }
      #splash .splash-logo {
        position: relative;
        display: inline-block;
        width: 72px;
        height: 72px;
      }
      #splash .splash-logo img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      #splash .splash-base {
        filter: grayscale(1) brightness(1.5) opacity(0.45);
      }
      #splash .splash-shine {
        -webkit-mask-image: linear-gradient(115deg, transparent 42%, #fff 50%, transparent 58%);
        mask-image: linear-gradient(115deg, transparent 42%, #fff 50%, transparent 58%);
        -webkit-mask-size: 320% 320%;
        mask-size: 320% 320%;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        animation: splash-sweep 2.4s ease-in-out infinite;
      }
      @keyframes splash-sweep {
        0% {
          -webkit-mask-position: -60% 50%;
          mask-position: -60% 50%;
        }
        55% {
          -webkit-mask-position: 160% 50%;
          mask-position: 160% 50%;
        }
        100% {
          -webkit-mask-position: 160% 50%;
          mask-position: 160% 50%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .splash-shine {
          animation: none;
          -webkit-mask-image: none;
          mask-image: none;
          opacity: 0.85;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Cargando">
      <div class="splash-logo">
        <img class="splash-base" src="/loading-logo.webp" alt="" />
        <img class="splash-shine" src="/loading-logo.webp" alt="" />
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
